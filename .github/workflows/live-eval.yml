name: Live Claude evaluation

# Manual only: each run makes 12 real Claude API calls. Needs the ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Live evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run test:live
